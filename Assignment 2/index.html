<style>

    #stdTable{

        font-family: Arial, sans-serif;

    .gameTitleHeader{
        background-color: peachpuff;
        font-size: 24px;

    }

        text-align: center;
        border: 1px solid black;
        padding: 10px;

    #score-value{
        color: red;
    }

    #gameButtonsDiv{
        background-color: lime;
    }

</style>

<script type="text/javascript">
    let chosenNumber = 0;
    let currentScore = 0;
    let interval = null;

    let firstNumberChosenCount = 0; 
    let secondNumberChosenCount = 0;
    let thirdNumberChosenCount = 0;

    function startGame(){
        document.getElementById("chosenNumber").disabled = true;
        chosenNumber = parseInt(document.getElementById("chosenNumber").value);
        currentScore = 0;
        updateScore();
        startInterval();
    }

    function endGame(){
        document.getElementById("chosenNumber").disabled = false;
        clearInterval(interval);
    }

    function updateScore(){
        document.getElementById("score-value").textContent = currentScore;
    }

    function startInterval(){
        if(interval){
            clearInterval(interval);
        }
        interval = setInterval(generateRandomNumber, 2000);
    }

    function generateRandomNumber(){
        let numbers = [];
        while (numbers.length < 3){
            let random = Math.floor(Math.random() * 10)
            if(!numbers.includes(random)){
                numbers.push(random);
            }
        }
        document.getElementById("num1").textContent = numbers[0];
        document.getElementById("num2").textContent = numbers[1];
        document.getElementById("num3").textContent = numbers[2];

        firstNumberChosenCount = 0;
        secondNumberChosenCount = 0;
        thirdNumberChosenCount = 0;
    }

    function clickFirstNum(event){
        let clickedNumber = parseInt(event.target.textContent);
        if(firstNumberChosenCount == 0){
            if(clickedNumber == chosenNumber){
                currentScore += 3;
            }else{
                currentScore -= 2;
            }
            updateScore();
        }
        firstNumberChosenCount++;
    }

    function clickSecondNum(event) {
        let clickedNumber = parseInt(event.target.textContent);
        if (secondNumberChosenCount == 0) {
            if (clickedNumber == chosenNumber) {
                currentScore += 3;
            } else {
                currentScore -= 2;
            }

            updateScore();
        }
        secondNumberChosenCount++;
    }

    function clickThirdNum(event) {
        let clickedNumber = parseInt(event.target.textContent);
        if (thirdNumberChosenCount == 0) {
            if (clickedNumber == chosenNumber) {
                currentScore += 3;
            } else {
                currentScore -= 2;
            }
            updateScore();
        }
        thirdNumberChosenCount++;
    }

</script>
